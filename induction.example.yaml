server: your-llamacpp-inference-endpoint
timeout: 20m
pollInterval: 2s
loadWaitInterval: 1s
sidebarWidth: 64
log:
  prefix: "induction: "
  microseconds: true
  truncateOnRun: true

# Optional MCP server configuration:
# mcpServers:
#   - mcpServerAllow: true
#     mcpServerName: your-mcp-server-name
#     mcpServerURL: your-mcp-server-endpoint

# Optional model manager configuration. Required only for `models` commands:
# modelManager:
#   searchResults: 20
#   preferredProviders:
#     - unsloth
#   modelsPath: /path/to/saved/models
#   huggingFaceToken: {optional-hugging-face-token}

# Optional resource budget configuration:
# Enable the cutoff and configure at least one threshold. Each threshold is
# optional; omit or leave unused thresholds blank.
# resourceBudget:
#   reasoning:
#     cutoff:
#       enabled: true
#       maxTokens: 4096
#       maxSeconds: 30
#       maxContextPercent: 75
