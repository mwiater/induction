server: your-llamacpp-inference-endpoint
timeout: 20m
pollInterval: 2s
loadWaitInterval: 1s
sidebarWidth: 64
log:
  # Optional log destination and console toggle. Defaults are used when omitted.
  # path: induction.log
  # console: false
  prefix: "induction: "
  microseconds: true
  truncateOnRun: true

# Optional MCP server configuration:
# mcpServers:
#   - mcpServerAllow: true
#     mcpServerName: your-mcp-server-name
#     mcpServerURL: your-mcp-server-endpoint

# Optional model manager configuration. Required only for `models` commands:
# modelManager:
#   searchResults: 20
#   preferredProviders:
#     - unsloth
#   preferredQuantizations:
#     - Q4_K_M
#   includePatterns:
#     - "*Q4_K_M*"
#   excludePatterns:
#     - "*IQ*"
#   availableRAM: 32GB
#   availableVRAM: 16GB
#   modelsPath: /path/to/saved/models
#   huggingFaceToken: "your-hugging-face-token"

# Optional resource budget configuration:
# Enable the cutoff and configure at least one threshold. Each threshold is
# optional; omit or leave unused thresholds blank.
# resourceBudget:
#   reasoning:
#     cutoff:
#       enabled: true
#       maxTokens: 4096
#       maxSeconds: 30
#       maxContextPercent: 75
