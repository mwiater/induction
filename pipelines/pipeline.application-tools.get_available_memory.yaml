name: application-tools-get-available-memory

steps:
  - name: collect-memory
    model: Granite-4.0-Micro-3B-Q8_0
    systemPrompt: Use the local `get_available_memory` application tool and preserve its numeric memory and swap fields exactly.
    userPrompt: Call `get_available_memory` and return its complete structured result.

  - name: format-memory
    model: Qwen-3.6-35B-A3B-MTP-Coding-Q8_K_XL
    systemPrompt: Return JSON only and preserve the preceding application-tool result.
    userPrompt: Return an object with exactly one property, `memory`, containing the complete result from `get_available_memory`.
    parameters:
      maxTokens: 256
    responseFormat:
      type: json_object
    output:
      type: json
      artifact: final-output.json
