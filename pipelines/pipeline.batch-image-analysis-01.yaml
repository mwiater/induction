name: batch-image-analysis
# Each batch item executes the complete pipeline independently.
# Paths are relative to the pipelines/ directory.
batch:
  items:
    - id: image-001
      images: [../data/fixtures/images/fixture-01.jpg]
    - id: image-002
      images: [../data/fixtures/images/fixture-02.jpg]
steps:
- name: analyze-image-subjects
  model: Granite-4.1-4B-Q4_K_M
  systemPrompt: |
    You are a careful visual analyst. Identify the primary subjects and describe only what is visually supported by the image. Distinguish clearly between people, animals, objects, and important background elements. Describe observable actions, poses, appearance, spatial relationships, and salient details. Do not invent identities, locations, clothing details, or causes that cannot be established from the image.
  userPrompt: |
    Analyze the provided image and describe its primary subjects concisely. Organize by subject, include only key visual evidence, and state uncertainty. Stay under 250 words.
  parameters:
    temperature: 0.2
- name: analyze-image-composition
  model: Granite-4.1-4B-Q8_0
  systemPrompt: |
    You are an expert photography and visual-composition analyst. Focus on formal visual structure rather than guessing the photographer's intent. Base the analysis on observable evidence and use precise spatial language. Consider framing, visual weight, balance, focal points, hierarchy, perspective, depth, leading lines, negative space, color, contrast, lighting, horizon placement, and reflections when they are present.
  userPrompt: |
    Analyze the provided image's composition concisely. Explain the major arrangement and attention cues using only visible features. Stay under 200 words.
  parameters:
    temperature: 0.2
- name: analyze-image-environmental
  model: Gemma-4-E4B-UNC-Q8_K_P
  systemPrompt: |
    You are a cautious environmental-context analyst. Separate direct visual observations from reasonable interpretations. Discuss terrain, water, vegetation, weather, atmosphere, season, built environment, lighting, and apparent human activity when relevant. Never identify a specific place, species, material, altitude, time, or weather condition as fact unless the image provides strong evidence; label inferences explicitly.
  userPrompt: |
    Analyze the image's environmental context concisely: visible setting first, then cautious interpretations. Clearly label uncertainty and stay under 200 words.
  parameters:
    temperature: 0.2
- name: analyze-geographic-clues
  model: Qwen-3.5-9B-MTP-General-Q4_K_M
  systemPrompt: |-
    You are a conservative visual geolocation analyst. Identify visible clues such as distinctive landmarks, architecture, writing, road signs, vegetation, terrain, license-plate styles, and infrastructure. Distinguish direct observations from hypotheses. Never infer a precise address or coordinates from generic scenery. An exact place name requires a distinctive recognizable landmark or legible identifying text. If there is insufficient evidence, explicitly say unknown. Do not assume that a photo's apparent cultural style proves its location.
  userPrompt: |-
    Assess the likely photo location concisely. Report observed clues, the most specific defensible estimate or unknown, alternatives, and low-confidence reasons. Do not claim external lookup. Stay under 180 words.
  parameters:
    temperature: 0.1
- name: analyze-camera-and-medium
  model: Qwen-3.8-27B-Non-Reasoning-Q4_K_M
  systemPrompt: |-
    You are a forensic photographic-process analyst. Distinguish visible appearance from capture technology. Describe grain/noise, sharpness, dynamic range, color rendition, halation, borders, artifacts, and signs of scanning or editing. Film-like appearance can be simulated digitally; a scanned photograph may be a print or reproduction. Do not name a camera make/model, film stock, focal length, aperture, or sensor without direct visible evidence such as a legible border imprint or camera label. State unknown when not identifiable.
  userPrompt: |-
    Analyze the photographic process concisely: photographic/rendered/composited appearance, analog/digital/unknown, and camera or film only when supported. Include evidence and confounds. Stay under 180 words.
  parameters:
    temperature: 0.1
- name: analyze-historical-date
  model: MiniCPM-4.7-35B-A3B-Q4_K_M
  systemPrompt: |-
    You are a cautious photo dating analyst. Estimate capture era from observable objects, clothing, architecture, vehicles, signage, technology, photographic processes, and image appearance. Differentiate when a depicted object was made from when the image was captured. Modern photos may depict old scenes; images may be colorized, restored, filtered, or AI-generated. Give a year or interval only when clues justify it, otherwise unknown. Do not invent dates or precise years.
  userPrompt: |-
    Identify concrete temporal clues and contradictions concisely. Give the narrowest defensible capture-year interval or unknown, distinguishing scene era from capture year. Stay under 180 words.
  parameters:
    temperature: 0.1
- name: analyze-visible-text-and-details
  model: Muse-Glimmer-30B-Q4_K_XL
  systemPrompt: |-
    You are a careful image transcription and object-detail analyst. Transcribe only text you can clearly read, preserving capitalization and marking uncertain text as uncertain. Do not invent words from blurred signs. Identify distinctive objects, clothing, vehicles, architecture, artwork, symbols, and notable contextual details that help future image search. Avoid identifying private individuals.
  userPrompt: |-
    Report only legible text, notable objects, distinctive details, and useful retrieval keywords. If no readable text is present, say none observed. Stay under 180 words.
  parameters:
    temperature: 0.1
- name: analyze-light-color-and-quality
  model: Qwen-3.6-35B-A3B-MTP-Coding-Q8_K_XL
  systemPrompt: |-
    You are an image quality and lighting analyst. Describe visible lighting direction, softness, color temperature, shadows, exposure, tonal range, dominant colors, focus, depth of field, motion blur, noise, compression artifacts, cropping, and apparent alterations. Do not claim numerical EXIF settings or actual camera metadata. Do not confuse intentional style with technical defects.
  userPrompt: |-
    Evaluate lighting, color, focus, sharpness, quality, editing clues, and technique using visible evidence only. Note uncertainty and stay under 180 words.
  parameters:
    temperature: 0.1
- name: analyze-search-and-safety-context
  model: Qwen-3.8-27B-Reasoning-Q4_K_M
  systemPrompt: |-
    You are a neutral archival metadata analyst. Summarize visible events or activities, broad image category, searchable keywords, and any notable uncertainty or sensitive-context considerations. Avoid identifying people, inferring sensitive personal attributes, or assigning an exact location to private scenes. Do not invent copyright status, authorship, provenance, or ownership.
  userPrompt: |-
    Propose a short neutral title, archival caption, category, activities, and searchable keywords. Note reproduction/screenshot/illustration/photograph only if supported. Stay under 180 words.
  parameters:
    temperature: 0.1
- name: return-json
  model: Qwen-3.6-35B-A3B-MTP-General-Q8_K_XL
  systemPrompt: |-
    You are a strict archival JSON serialization assistant. Synthesize only the accumulated image analyses, without introducing unsupported details. Output exactly one JSON object matching the schema, with every required field and no additional fields. Keep estimates calibrated: confidence is an evidence-strength judgment from 0.0 (no evidence) to 1.0 (strong direct visual evidence), not a statistical probability. For location, camera, film, and capture year, use null when the specific value cannot be defensibly inferred; use confidence 0.0 and explain why. Do not mistake stylistic resemblance for identification. For capture_year, use null if unknown; if known only as a range, use earliest_year and latest_year and leave capture_year null. A camera category is not a camera make/model. Film type (e.g. color negative) is distinct from film stock (e.g. a branded product). Never fabricate EXIF, GPS, metadata, or external lookup results. Preserve uncertainty, transcribe text only when legible, and output JSON only.
  userPrompt: |-
    Synthesize the prior image analyses into complete searchable metadata. Preserve concise versions of the subjects, composition, and environmental descriptions. Populate every required field; use null for unknown estimates and [] for absent lists. Do not add unsupported claims. Return only schema-valid JSON and keep each string concise.
  responseFormat:
    type: json_object
  parameters:
    temperature: 0.1
  jsonSchema:
    type: object
    properties:
      subjects:
        type: string
      composition:
        type: string
      environmental_context:
        type: string
      title:
        type: string
      caption:
        type: string
      image_category:
        type: string
      activities:
        type: array
        items:
          type: string
      keywords:
        type: array
        items:
          type: string
      visible_text:
        type: array
        items:
          type: string
      distinctive_details:
        type: array
        items:
          type: string
      lighting:
        type: string
      color_palette:
        type: array
        items:
          type: string
      photographic_technique:
        type: string
      image_quality:
        type: string
      editing_or_reproduction_clues:
        type: string
      location_estimate:
        type: object
        properties:
          value:
            type:
            - string
            - 'null'
          confidence:
            type: number
            minimum: 0
            maximum: 1
          evidence:
            type: array
            items:
              type: string
          caveats:
            type: string
        required:
        - value
        - confidence
        - evidence
        - caveats
        additionalProperties: false
      camera_estimate:
        type: object
        properties:
          value:
            type:
            - string
            - 'null'
          confidence:
            type: number
            minimum: 0
            maximum: 1
          evidence:
            type: array
            items:
              type: string
          caveats:
            type: string
          camera_category:
            type:
            - string
            - 'null'
        required:
        - value
        - confidence
        - evidence
        - caveats
        - camera_category
        additionalProperties: false
      film_estimate:
        type: object
        properties:
          value:
            type:
            - string
            - 'null'
          confidence:
            type: number
            minimum: 0
            maximum: 1
          evidence:
            type: array
            items:
              type: string
          caveats:
            type: string
          medium:
            type: string
          film_type:
            type:
            - string
            - 'null'
          film_stock:
            type:
            - string
            - 'null'
        required:
        - value
        - confidence
        - evidence
        - caveats
        - medium
        - film_type
        - film_stock
        additionalProperties: false
      capture_date_estimate:
        type: object
        properties:
          value:
            type:
            - integer
            - 'null'
          confidence:
            type: number
            minimum: 0
            maximum: 1
          evidence:
            type: array
            items:
              type: string
          caveats:
            type: string
          earliest_year:
            type:
            - integer
            - 'null'
          latest_year:
            type:
            - integer
            - 'null'
          scene_era:
            type:
            - string
            - 'null'
        required:
        - value
        - confidence
        - evidence
        - caveats
        - earliest_year
        - latest_year
        - scene_era
        additionalProperties: false
    required:
    - subjects
    - composition
    - environmental_context
    - title
    - caption
    - image_category
    - activities
    - keywords
    - visible_text
    - distinctive_details
    - lighting
    - color_palette
    - photographic_technique
    - image_quality
    - editing_or_reproduction_clues
    - location_estimate
    - camera_estimate
    - film_estimate
    - capture_date_estimate
    additionalProperties: false
  output:
    type: json
    artifact: '{{source.basename}}.{{source.extension}}.json'
