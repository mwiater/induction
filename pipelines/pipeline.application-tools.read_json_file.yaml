name: application-tools-read-json-file

steps:
  - name: collect-json-file
    model: Granite-4.0-Micro-3B-Q8_0
    systemPrompt: Use the local `read_json_file` application tool and preserve the parsed JSON values exactly.
    userPrompt: |
      Call `read_json_file` with this JSON argument and return its complete result:
      {"path":"data/.local/v1_models.json","property":"data"}

  - name: format-json-file
    model: Qwen-3.6-35B-A3B-MTP-Coding-Q8_K_XL
    systemPrompt: Return JSON only and preserve the parsed JSON array exactly.
    userPrompt: Return an object with exactly one property, `json_data`, containing the complete result from `read_json_file`.
    responseFormat:
      type: json_object
    output:
      type: json
      artifact: final-output.json
