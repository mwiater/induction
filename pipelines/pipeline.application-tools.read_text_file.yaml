name: application-tools-read-text-file

steps:
  - name: collect-text-file
    model: Granite-4.0-Micro-3B-Q8_0
    systemPrompt: Use the local `read_text_file` application tool. Read only the requested workspace file and preserve its content exactly.
    userPrompt: |
      Call `read_text_file` with this JSON argument and return its complete result:
      {"path":"README.md","max_bytes":20000}

  - name: format-text-file
    model: Qwen-3.6-35B-A3B-MTP-Coding-Q8_K_XL
    systemPrompt: Return JSON only and preserve the file content exactly.
    userPrompt: Return an object with exactly one property, `text_file`, containing the complete result from `read_text_file`.
    responseFormat:
      type: json_object
    output:
      type: json
      artifact: final-output.json
