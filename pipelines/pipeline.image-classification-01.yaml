name: image-classification

config: induction.yaml

# Replace the fixture path below with any photograph you want to classify.
# The image is attached only on the first step and remains available through
# the inherited pipeline conversation for the later classification rounds.
steps:
  - name: classify-primary-subject
    model: Qwen-3.8-27B-Non-Reasoning-Q4_K_M
    nomcp: true
    systemPrompt: |
      You are a visual classification system.

      Classify the supplied photograph using exactly one numeric category.
      Output one token from the configured classification candidates. Do not
      explain your answer.

      This is a general-purpose photograph, so choose the category that best
      describes the most visually prominent subject.
    userPrompt: |
      Classification round 1: primary subject.

      Classify the most prominent subject in the photograph:
      1 = person or people
      2 = animal or animals
      3 = vehicle or vehicles
      4 = building or architecture
      5 = food or drink
      6 = landscape, scenery, or nature
      7 = object or objects
      8 = no clear primary subject

      Output the single category token now.
    image: ../data/fixtures/images/fixture.jpg
    classification:
      candidates:
        "1": person or people
        "2": animal or animals
        "3": vehicle or vehicles
        "4": building or architecture
        "5": food or drink
        "6": landscape, scenery, or nature
        "7": object or objects
        "8": no clear primary subject
      topLogprobs: 100

  - name: classify-environment
    model: Qwen-3.8-27B-Non-Reasoning-Q4_K_M
    nomcp: true
    systemPrompt: |
      The primary-subject classification is complete. Perform a new,
      independent classification of the same photograph. Output only one
      numeric token from this round's candidates and do not explain.
    userPrompt: |
      Classification round 2: environment or setting.

      Classify the dominant setting of the same photograph:
      1 = indoor space
      2 = urban or built outdoor space
      3 = road, street, or transport setting
      4 = rural, wilderness, or natural outdoor space
      5 = beach, water, or shoreline
      6 = event, crowd, or public gathering
      7 = close-up or indeterminate setting

      Output the single category token now.
    classification:
      candidates:
        "1": indoor space
        "2": urban or built outdoor space
        "3": road, street, or transport setting
        "4": rural, wilderness, or natural outdoor space
        "5": beach, water, or shoreline
        "6": event, crowd, or public gathering
        "7": close-up or indeterminate setting
      topLogprobs: 100

  - name: classify-activity
    model: Qwen-3.8-27B-Non-Reasoning-Q4_K_M
    nomcp: true
    systemPrompt: |
      The earlier classification rounds are complete. Perform another
      independent classification of the same photograph. Output only one
      numeric token from this round's candidates and do not explain.
    userPrompt: |
      Classification round 3: visible activity or image content.

      Classify what is primarily happening or being shown:
      1 = posed portrait or people-focused scene
      2 = people engaged in an activity
      3 = animal-focused scene or animal activity
      4 = travel, transport, or driving scene
      5 = object, product, or still-life presentation
      6 = food, meal, or drink presentation
      7 = landscape, scenery, or weather scene
      8 = no clear activity or content type

      Output the single category token now.
    classification:
      candidates:
        "1": posed portrait or people-focused scene
        "2": people engaged in an activity
        "3": animal-focused scene or animal activity
        "4": travel, transport, or driving scene
        "5": object, product, or still-life presentation
        "6": food, meal, or drink presentation
        "7": landscape, scenery, or weather scene
        "8": no clear activity or content type
      topLogprobs: 100

  - name: classify-conditions
    model: Qwen-3.8-27B-Non-Reasoning-Q4_K_M
    nomcp: true
    systemPrompt: |
      The earlier classification rounds are complete. Perform one final
      independent classification of the same photograph. Output only one
      numeric token from this round's candidates and do not explain.
    userPrompt: |
      Classification round 4: visible image conditions.

      Classify the dominant visual conditions:
      1 = bright daylight
      2 = low light, dusk, or night
      3 = artificial indoor lighting
      4 = overcast, rainy, or visibly hazy
      5 = high-contrast or strongly shadowed
      6 = unclear from the photograph

      Output the single category token now.
    classification:
      candidates:
        "1": bright daylight
        "2": low light, dusk, or night
        "3": artificial indoor lighting
        "4": overcast, rainy, or visibly hazy
        "5": high-contrast or strongly shadowed
        "6": unclear from the photograph
      topLogprobs: 100

  - name: summarize-classifications
    model: Qwen-3.8-27B-Non-Reasoning-Q4_K_M
    nomcp: true
    systemPrompt: |
      All image-classification rounds are complete. The preceding assistant
      messages contain application-generated JSON results from four rounds.
      Do not perform another classification and do not output a bare numeric
      token. Summarize those results in concise prose, naming each round and
      its selected label. Mention uncertainty when a confidence is low.
    userPrompt: |
      Summarize the four classification results for the photograph. Include
      the primary subject, environment, activity or content, and visible
      conditions. Use the labels from the preceding JSON results and do not
      invent details that are not present.
