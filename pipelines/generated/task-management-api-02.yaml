name: generated-to-produce-a-comprehensive-technical-design-document-for-a-task
steps:
    - name: "1"
      model: Agents-A1-MTP-Apex-I-Quality
      userPrompt: |
        [ORIGINAL USER PROMPT]
        <USER_PROMPT>
        Design a production-ready REST API for a task-management service.

        First identify the functional and non-functional requirements and make explicit
        any necessary assumptions. Then design the core data model and relationships.
        Specify the HTTP API, including resources, methods, representative request and
        response bodies, status codes, pagination, filtering, and error behavior.
        Define authentication and authorization rules. Create a testing strategy that
        covers unit, integration, API, security, and failure testing. Finally, describe
        a practical deployment and observability approach and combine all of this into
        a coherent implementation specification that an engineering team could use as
        the starting point for development.

        Keep the design technology-neutral unless a concrete example materially
        improves clarity.
        </USER_PROMPT>

        [PIPELINE CONTEXT]

        Original objective:
        To produce a comprehensive technical design document for a task-management REST API covering requirements, data modeling, API specification, security, testing, and deployment strategies.

        Original constraints:
        - Maintain technology neutrality unless concrete examples enhance clarity
        - Ensure production-ready standards for all design aspects
        - Explicitly document all assumptions made during the design process
        - Cover both functional and non-functional requirements comprehensively

        Requested deliverables:
        - Functional and non-functional requirements specification with assumptions
        - Core data model and entity relationship definitions
        - Detailed REST API contract including resources, methods, payloads, and status codes
        - Authentication and authorization security policy
        - Comprehensive testing strategy covering unit, integration, API, security, and failure scenarios
        - Deployment and observability architecture plan
        - Coherent implementation specification for engineering teams

        [CURRENT TASK]

        Task:
        Requirements Analysis

        Objective:
        Identify functional and non-functional requirements and make explicit any necessary assumptions for a task-management service.

        Inputs:
        - Original User Prompt

        Required output:
        - List of core functional features (e.g., create, update, assign tasks)
        - Non-functional constraints (performance, availability, scalability)
        - Explicit list of design assumptions regarding users and data

        Acceptance criteria:
        - All core task management capabilities are covered
        - Scalability and performance assumptions are clearly stated
        - Assumptions are distinct from requirements

        Complete this task only.
      systemPrompt: |-
        You are executing one stage of a larger Induction pipeline.

