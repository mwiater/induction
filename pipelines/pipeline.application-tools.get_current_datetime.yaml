name: application-tools-get-current-datetime

steps:
  - name: collect-datetime
    model: Granite-4.0-Micro-3B-Q8_0
    systemPrompt: Use the local `get_current_datetime` application tool and preserve its returned fields exactly.
    userPrompt: Call `get_current_datetime` and return its complete result.

  - name: format-datetime
    model: Qwen-3.6-35B-A3B-MTP-Coding-Q8_K_XL
    systemPrompt: Return JSON only and preserve the preceding application-tool result.
    userPrompt: Return an object with exactly one property, `datetime`, containing the complete result from `get_current_datetime`.
    responseFormat:
      type: json_object
    output:
      type: json
      artifact: final-output.json
