name: image-qwen38

config: induction.yaml

steps:
  - name: analyze-image
    model: Qwen-3.8-27B-Non-Reasoning-Q4_K_M
    nomcp: true
    systemPrompt: You are an OCR specialist. Read only text visibly present in the supplied image and preserve uncertainty rather than guessing.
    userPrompt: Transcribe every readable text element in the image in visual reading order. Preserve capitalization, numbers, punctuation, and meaningful line breaks. Identify text that is partially obscured or ambiguous.
    image: ../data/fixtures/images/fixture-text.jpg

  - name: structure-ocr-results
    model: Qwen-3.8-27B-Non-Reasoning-Q4_K_M
    nomcp: true
    systemPrompt: You organize OCR results for downstream data entry. Treat the preceding transcription as the source of truth and do not silently correct it.
    userPrompt: Convert the preceding transcription into labeled fields where the content supports them, such as title, date, organization, address, contact details, prices, and other labels. Preserve the exact extracted text alongside each field and list any text that does not fit a field.
