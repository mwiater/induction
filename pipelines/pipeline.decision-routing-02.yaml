name: decision-routing-02-food-safety-after-power-outage
config: induction.yaml

steps:
  - name: outage-duration
    model: Kev-4B-Q8_0
    nomcp: true
    systemPrompt: You are a careful food-safety decision model.
    userPrompt: Did the power outage last more than four hours?
    decision:
      endpoint: systemone
      type: choice
      state:
        outage_duration_hours: 6
        refrigerator_door_stayed_closed: true
        refrigerator_temperature_when_power_returned_f: 46
        refrigerator_temperature_history_available: false
        refrigerator_contents:
          - raw chicken
          - milk
          - leftovers
      instructions: Did the power outage last more than four hours?
      candidates:
        over_four_hours: The outage lasted more than four hours.
        four_hours_or_less: The outage lasted four hours or less.
        unknown: The outage duration cannot be determined from the facts.

  - name: refrigerator-temperature
    model: Kev-4B-Q8_0
    nomcp: true
    systemPrompt: You are a careful food-safety decision model.
    userPrompt: Was the measured refrigerator temperature above 40°F when power returned?
    decision:
      endpoint: systemone
      type: choice
      state:
        outage_duration_hours: 6
        refrigerator_door_stayed_closed: true
        refrigerator_temperature_when_power_returned_f: 46
        refrigerator_temperature_history_available: false
        refrigerator_contents:
          - raw chicken
          - milk
          - leftovers
      instructions: Was the measured refrigerator temperature above 40°F when power returned?
      candidates:
        above_40F: The measured refrigerator temperature was above 40°F when power returned.
        at_or_below_40F: The measured refrigerator temperature was at or below 40°F when power returned.
        unknown: The measured refrigerator temperature cannot be determined from the facts.

  - name: perishable-foods
    model: Kev-4B-Q8_0
    nomcp: true
    systemPrompt: You are a careful food-safety decision model.
    userPrompt: Does the refrigerator contain perishable food covered by power-outage food-safety guidance?
    decision:
      endpoint: systemone
      type: choice
      state:
        refrigerator_contents:
          - raw chicken
          - milk
          - leftovers
      instructions: Does the refrigerator contain perishable food covered by power-outage food-safety guidance?
      candidates:
        perishable_food_present: The refrigerator contains perishable food such as raw chicken, milk, or leftovers.
        no_perishable_food: The refrigerator contains no perishable food covered by the guidance.
        unknown: Whether perishable food is present cannot be determined from the facts.

  - name: unsafe-temperature-duration
    model: Kev-4B-Q8_0
    nomcp: true
    systemPrompt: Do not infer a temperature history from a single thermometer reading. Choose unknown when the stated facts do not establish the duration.
    userPrompt: Do the facts establish that the food was above 40°F for four hours or more?
    decision:
      endpoint: systemone
      type: choice
      state:
        outage_duration_hours: 6
        refrigerator_door_stayed_closed: true
        refrigerator_temperature_when_power_returned_f: 46
        refrigerator_temperature_history_available: false
        refrigerator_contents:
          - raw chicken
          - milk
          - leftovers
      instructions: Do the facts establish that the food was above 40°F for four hours or more?
      candidates:
        four_hours_or_more_established: The facts establish that food was above 40°F for four hours or more.
        less_than_four_hours_established: The facts establish that food was above 40°F for less than four hours.
        duration_unknown: The facts do not establish how long the food was at or above 40°F.

  - name: food-safety-decision-tree
    model: Qwen-3.5-9B-MTP-General-Q8_0
    nomcp: true
    systemPrompt: |
      You are a clear, cautious food-safety explainer. Use the supplied
      decision results and FDA guidance. Do not invent facts or treat model
      probabilities as medical certainty. Clearly distinguish the measured
      facts from unknowns.
    userPrompt: |
      Print a readable four-level decision tree for this household food-safety
      problem. At every level, show every candidate's semantic value and
      normalized probability from that level's result, then identify the
      selected value. Do not omit alternatives or report only the winning
      probability. Format each level as a tree node with all candidate branches;
      mark the selected branch with `→` and the other branches with `├` or `└`.
      After the four levels, print the path followed as an ordered sequence of
      selected values.

      Use these complete decision results:
      Level 1, outage duration:
      {{steps.outage-duration.output}}

      Level 2, refrigerator temperature:
      {{steps.refrigerator-temperature.output}}

      Level 3, perishable foods present:
      {{steps.perishable-foods.output}}

      Level 4, duration above 40°F:
      {{steps.unsafe-temperature-duration.output}}

      Then give a concise practical recommendation for the raw chicken, milk,
      and leftovers. FDA guidance says the refrigerator keeps food cold for
      about four hours if unopened; refrigerated perishable food that has
      been above 40°F for four hours or more should be discarded. If it is
      unknown how long food has been at or above 40°F, do not take a chance
      with it. Do not use smell or appearance to decide whether food is safe.
      Explain how the unknown temperature history affects this case. Do not
      imply that the probabilities are calibrated medical certainty.

      Guidance source:
      https://www.fda.gov/food/buy-store-serve-safe-food/food-and-water-safety-during-power-outages-and-floods
