# JPEG creativity v2: same generation prompt across profiles; no maxTokens overrides.
# Technical audit distinguishes syntax, feasibility, and novelty.
name: jpeg-creative-rate-distortion-v2
config: induction.yaml
steps:
- name: baseline
  model: GPT-OSS-120B-UD-Q4_K_XL
  nomcp: true
  systemPrompt: |-
    You are researching new algorithms for an ENCODER that emits ordinary 8-bit baseline sequential DCT JPEG. The unchanged decoder is the only decoder. Objective: minimize actual complete .jpg file bytes while matching a specified perceptual quality threshold against the uncompressed source. Decoded pixels MAY differ from source pixels; this is ordinary lossy compression, not a compatibility violation.

    Be genuinely inventive but mechanistic. Do not invent JPEG syntax, make impossibility claims without proof, or claim proven novelty or compression gains. A new search method is feasible but is not automatically a fundamentally new compression mechanism. Encode-side learning, search, or expensive computation is allowed; no model, metadata, dictionary, or sidecar may be needed by the decoder. Do not use any earlier pipeline output as inspiration: respond only to the request below.
  userPrompt: |-
    RESEARCH TASK: Invent FIVE distinct, falsifiable encoder-side research hypotheses that could reduce total baseline JPEG bytes at MATCHED perceptual quality against a strong modern encoder (MozJPEG or jpegli). Focus on surprising but plausible algorithms rather than new names for existing methods.

    LEGAL DESIGN SPACE: source-domain preprocessing that still preserves matched perceptual quality; image-dependent choice of globally signaled JPEG quantization tables; legal per-block quantized DCT coefficient choices under shared tables; DC prediction-aware coefficient choices; legal scan/component configuration; legal canonical Huffman tables; co-optimization across these decisions. Any proposed setting must obey 8-bit baseline sequential JPEG limits. There is NO requirement to preserve quantized coefficients or exact output pixels. Do not rely on per-block quantization tables or chroma subsampling switches that cannot be signaled in baseline syntax. JPEG DHT symbols need not be numerically sorted; a Huffman optimization is not by itself novel.

    INVENTIVE SEARCH: Try five DIFFERENT causal mechanisms, not five parameterizations of one Q-table or coefficient-search family. Prefer underexplored interactions, constrained optimization principles, or cross-domain mechanisms that translate to concrete encoder variables. Avoid mere repackaging of trellis RDO, common masking, Huffman optimization, and learned perceptual tuning. Those may be components, but identify the actual new hypothesis. If the idea is essentially a faster optimization search, label it honestly rather than claiming new compression capability.

    For each of five numbered ideas, use these compact fields:
    - NAME and NOVEL HYPOTHESIS (one sentence)
    - LEGAL JPEG DEGREES OF FREEDOM (exact encoder variables, syntax implications)
    - MECHANISM (2-4 operational steps; include an equation or objective when useful)
    - CAUSAL RATE-DISTORTION CLAIM (why bytes might decrease at the same perceptual quality; account for headers/tables)
    - NEAREST KNOWN FAMILY and DISTINCTIVE DIFFERENCE (possible overlap, not verified prior art)
    - FAILURE MODE and COMPUTE COST
    - FALSIFICATION TEST (smallest experiment, matched-quality comparison versus MozJPEG and jpegli)

    Make each proposal specific enough to prototype. About 110-150 words per idea. Do not promise a positive result. If a proposal cannot identify a legal encoder variable and a test, discard it and invent a replacement before answering.
  parameters:
    temperature: 0.95
    topP: 0.95
    topK: 40
    minP: 0.03
    xtcProbability: 0.0
    xtcThreshold: 0.1
    typicalP: 1.0
    repeatPenalty: 1.05
    presencePenalty: 0.0
    frequencyPenalty: 0.0
    repeatLastN: 64
    seed: 42
