version: 2

project_name: induction

# Keep release hooks usable in constrained environments where the default Go
# build cache is read-only. An explicitly supplied GOCACHE remains honored.
env:
  - GOCACHE={{ if index .Env "GOCACHE" }}{{ .Env.GOCACHE }}{{ else }}/tmp/induction-gocache{{ end }}

before:
  hooks:
    - go vet ./...
    - go test ./...
    - go test -race ./...

builds:
  - id: induction
    main: ./cmd/induction
    binary: induction
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
